<div class="modal fade" id="task-{{ task.pk }}-Modal" tabindex="-1" role="dialog" aria-labelledby="task-{{ task.pk }}-Modal" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title text-danger">Удаление задачи</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p>Вы уверены что хотите удалить задачу?</p>
                <p class="fw-bold">{{ task.description }}</p>
                <form action="{% url 'task_delete' task.pk %}" id="delete-form-{{ task.pk }}" method="POST">
                    {% csrf_token %}
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                <button type="submit" form="delete-form-{{ task.pk }}" class="btn btn-danger">Удалить</button>
            </div>
        </div>
    </div>
</div>
